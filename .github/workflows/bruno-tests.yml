name: Bruno API Tests (Docker)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Exécuter la collection Bruno via Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/tools \
            -w /tools \
            usebruno/cli:latest run